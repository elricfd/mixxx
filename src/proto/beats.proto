syntax = "proto2";

package mixxx.track.io;

option optimize_for = LITE_RUNTIME;

enum Source {
  ANALYZER = 0;
  FILE_METADATA = 1;
  USER = 2;
}

message Beat {
  optional int32 frame_position = 1;
  optional bool enabled = 2 [ default = true ];
  optional Source source = 3 [ default = ANALYZER ];
}

message Bpm {
  optional double bpm = 1;
  optional Source source = 2 [ default = ANALYZER ];
}

message BeatMap {
  repeated Beat beat = 1;
  // Fraction [0, 1] of the analyzed audio covered by constant-tempo regions
  // of at least 16 beats. Absent if unknown (e.g. not produced by the analyzer).
  optional double steady_coverage = 2;
}

message BeatGrid {
  optional Bpm bpm = 1;
  optional Beat first_beat = 2;
  // See BeatMap.steady_coverage.
  optional double steady_coverage = 3;
}
